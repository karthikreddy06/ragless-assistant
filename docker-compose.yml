services:
  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: ragless-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped

  # FastAPI RAGless Assistant Backend & Web UI
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragless-assistant
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    environment:
      - ENVIRONMENT=development
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - OLLAMA_TIMEOUT=60
      - DATABASE_PATH=knowledge.db
      - FAST_PATH_ENABLED=true
      - DETERMINISTIC_ANSWERS_ENABLED=true
      - ADMIN_TOKEN=${ADMIN_TOKEN:-local_dev_admin_secret_123456789}
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local
